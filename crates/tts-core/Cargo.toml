[package]
name = "tts-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TTS subsystem of the local AI runtime manager: model registry, engine adapters, voice library and audio manager."

[features]
# The mock engine exists only for the tests. It produces a sine wave instead
# of speech and makes the whole pipeline testable on a machine without a
# GPU. The application is built without it.
mock-engine = []

[dependencies]
ai-scheduler.workspace = true
async-trait.workspace = true
chrono.workspace = true
flate2.workspace = true
hound.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tar.workspace = true
thiserror.workspace = true
futures = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "net"] }
tracing.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The tests of the crate need the mock engine. The dependency on itself
# switches the feature on for the test build and leaves the application
# build untouched.
[dev-dependencies]
tts-core = { path = ".", features = ["mock-engine"] }
