[package]
name = "lm-lathe-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The local gateway of LM-Lathe: HTTP API and command line interface."

[lib]
name = "lm_lathe_server"
path = "src/lib.rs"

[[bin]]
name = "lm-lathe-server"
path = "src/main.rs"

[dependencies]
tts-core.workspace = true
ai-scheduler.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
reqwest = { workspace = true }
tower = { version = "0.5", features = ["util"] }
# The tests speak to a synthetic engine, so that they run on a machine
# without a GPU. The application is built without it.
tts-core = { path = "../tts-core", features = ["mock-engine"] }
