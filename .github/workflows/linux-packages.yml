name: Linux packages

# The Tauri shell needs the WebKitGTK stack of Linux, so the packages cannot be
# built on macOS. This workflow builds them on an Ubuntu runner and uploads
# the result as an artifact of the run.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    name: x86_64 (deb + AppImage)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install the system libraries of the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            wget

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build the packages
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri:build -- --bundles deb,appimage

      - name: Collect the packages
        run: |
          mkdir -p packages
          find apps/desktop/src-tauri/target/release/bundle \
            -type f \( -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp -f {} packages/ \;
          ls -lh packages

      - uses: actions/upload-artifact@v4
        with:
          name: lm-lathe-linux-x86_64
          path: packages/
          if-no-files-found: error

  release:
    name: Release
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: lm-lathe-linux-x86_64
          path: packages

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          draft: true
